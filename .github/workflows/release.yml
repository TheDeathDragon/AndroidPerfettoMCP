name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check tag against csproj version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/PerfettoMcp/PerfettoMcp.csproj | head -n 1)"
          [ "$tag" = "$ver" ] || { echo "::error::tag $GITHUB_REF_NAME does not match <Version>$ver</Version>"; exit 1; }

      - name: Test
        run: dotnet test PerfettoMcp.slnx -c Release --nologo

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: publish.bat ${{ matrix.rid }}

      # Built on Linux so the tarball keeps the executable bits.
      - name: Publish (Linux)
        if: runner.os == 'Linux'
        run: ./publish.sh ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: perfetto-mcp-${{ matrix.rid }}
          path: |
            publish/perfetto-mcp-*-${{ matrix.rid }}.zip
            publish/perfetto-mcp-*-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v h="## [$ver]" 'index($0, h) == 1 { f = 1; next } f && /^## \[/ { exit } f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section ## [$ver]"; exit 1; }
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
